<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseScore Web</title>
<style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --card: #fff; --muted: #6e6e73; --accent: #1e6fd9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --card: #2c2c2e; --muted: #a1a1a6; --accent: #4a9eff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; padding: 32px 16px; }
    h1 { margin: 0 0 8px; }
    p { color: var(--muted); }
    .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 24px 0; }
    a.app { display: block; padding: 20px; border-radius: 12px; background: var(--card); color: inherit; text-decoration: none;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    a.app:hover { outline: 2px solid var(--accent); }
    a.app strong { display: block; font-size: 1.15em; color: var(--accent); }
    a { color: var(--accent); }
</style>
</head>
<body>
<main>
    <h1>MuseScore Web</h1>
    <p>A port of MuseScore Studio's engraving engine from C++ to TypeScript that runs entirely in the browser.</p>
    <div class="apps">
        <a class="app" href="editor/"><strong>Editor</strong>Create and edit scores, play them back, save .mscz files.</a>
        <a class="app" href="viewer/"><strong>Viewer</strong>Open and display .mscz/.mscx files.</a>
    </div>
    <p>Source code: <a href="https://github.com/pstaender/musescoreweb">github.com/pstaender/musescoreweb</a> (GPL-3.0)</p>
</main>
</body>
</html>
