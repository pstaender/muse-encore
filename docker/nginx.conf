server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    # long-lived cache for hashed build assets
    location ~* \.(js|css|woff2?|otf|ttf|sf3)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # static files / directories (each app ships its own index.html)
    location / {
        try_files $uri $uri/ =404;
    }
}