# Self-host MuseEncore with Docker: `docker compose up -d --build`
services:
  muse-encore:
    build:
      context: .
      dockerfile: Dockerfile
    image: muse-encore:local
    container_name: muse-encore
    ports:
      - "8080:80"
    restart: unless-stopped